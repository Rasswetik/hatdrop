<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" preserveAspectRatio="xMidYMid slice" shape-rendering="crispEdges" role="img" aria-label="Пиксельная деревня в ночь Хэллоуина">
<style>
 .fire{animation:flicker 2.6s steps(3,end) infinite}
 .eye{animation:blink 5s steps(1,end) infinite}
 .bat1{animation:fly 13s linear infinite}
 .bat2{animation:fly 17s linear -6s infinite}
 .ghost{animation:float 4.2s steps(8,end) infinite}
 .star{animation:twinkle 6s steps(2,end) infinite}
 @keyframes flicker{0%,100%{opacity:1}25%{opacity:.75}48%{opacity:1}52%{opacity:.65}}
 @keyframes blink{0%,95%,100%{opacity:1}96%,99%{opacity:0}}
 @keyframes fly{0%{transform:translateX(-70px)}100%{transform:translateX(1080px)}}
 @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
 @keyframes twinkle{0%,100%{opacity:.8}50%{opacity:.25}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
