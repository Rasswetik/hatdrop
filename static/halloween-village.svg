<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" preserveAspectRatio="xMidYMid slice" shape-rendering="crispEdges" role="img" aria-label="Пиксельная деревня в ночь Хэллоуина">
<style>
 .fire {animation: fireFlicker 3.4s steps(3,end) infinite}
 .eye {animation: blink 7s steps(1,end) infinite}
 .star {animation: twinkle 5.9s steps(2,end) infinite}
 .bat1 {animation: batFlyA 13s linear infinite}
 .bat2 {animation: batFlyB 19s linear -7s infinite}
 .bat3 {animation: batFlyB 15s linear -12s infinite}
 .wing-left {transform-box:fill-box;transform-origin:right 38%;animation:wingLeft .27s ease-in-out infinite alternate}
 .wing-right {transform-box:fill-box;transform-origin:left 38%;animation:wingRight .27s ease-in-out infinite alternate}
 .bat2 .wing-left,.bat2 .wing-right {animation-duration:.21s}
 .bat3 .wing-left,.bat3 .wing-right {animation-duration:.33s}
 .ghost {animation: ghostFloat 4.3s ease-in-out infinite alternate}
 .ghost-alt {animation-duration:5.8s;animation-delay:-2s}
 .ghost-eye {animation: ghostEye 6s steps(2,end) infinite}
 .mist-a {animation:mistMove 19s ease-in-out infinite alternate}
 .mist-b {animation:mistMove 24s ease-in-out -12s infinite alternate-reverse}
 .lightfly {animation: lightfly 4s steps(6,end) infinite alternate}
 .lightfly:nth-child(even) {animation-delay:-1.8s;animation-duration:5.4s}
 .moon-halo {animation: moonBreath 8s ease-in-out infinite alternate}
 .fogline {animation:mistMove 10s linear infinite alternate}
 .treetops {animation:treeRock 8s steps(8,end) infinite alternate}
 .spider {animation:spiderSwing 4.8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:top center}
 .cauldron {animation:potBoil 2.8s steps(4,end) infinite alternate}
 .witch {animation:witchFly 22s linear infinite}
 .torch {animation:torchShimmer 4s steps(3,end) infinite}
 .grave-rune {animation:runeGlow 6s steps(3,end) infinite}
 @keyframes batFlyA {0%{transform:translate(-110px,18px)}24%{transform:translate(165px,-7px)}48%{transform:translate(450px,12px)}74%{transform:translate(730px,-11px)}100%{transform:translate(1110px,22px)}}
 @keyframes batFlyB {0%{transform:translate(-170px,0)}35%{transform:translate(290px,-25px)}70%{transform:translate(720px,8px)}100%{transform:translate(1180px,-14px)}}
 @keyframes wingLeft {from{transform:rotate(14deg) scaleY(.94)}to{transform:rotate(-23deg) scaleY(1.16)}}
 @keyframes wingRight {from{transform:rotate(-14deg) scaleY(.94)}to{transform:rotate(23deg) scaleY(1.16)}}
 @keyframes ghostFloat {from{transform:translateY(6px)}to{transform:translateY(-12px)}}
 @keyframes ghostEye {0%,87%,100%{opacity:1}89%,93%{opacity:.18}}
 @keyframes blink {0%,96%,100%{opacity:1}97%,99%{opacity:.1}}
 @keyframes fireFlicker{0%,100%{opacity:.9}25%{opacity:.64}47%{opacity:1}75%{opacity:.76}}
 @keyframes twinkle{0%,100%{opacity:.8}50%{opacity:.25}}
 @keyframes mistMove{from{transform:translateX(-26px)}to{transform:translateX(29px)}}
 @keyframes lightfly{0%{opacity:.15;transform:translate(0,0)}40%{opacity:1;transform:translate(5px,-11px)}100%{opacity:.35;transform:translate(-4px,-21px)}}
 @keyframes moonBreath{from{opacity:.14}to{opacity:.32}}
 @keyframes treeRock{from{transform:translateX(-2px)}to{transform:translateX(3px)}}
 @keyframes spiderSwing{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
 @keyframes potBoil{from{opacity:.5;transform:translateY(5px)}to{opacity:1;transform:translateY(-5px)}}
 @keyframes witchFly{from{transform:translate(-150px,10px)}to{transform:translate(1110px,-45px)}}
 @keyframes torchShimmer{0%,100%{opacity:.95}40%{opacity:.6}70%{opacity:1}}
 @keyframes runeGlow{0%,100%{opacity:.3}45%{opacity:.86}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
