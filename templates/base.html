<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#090727">
    <title>{% block title %}TON Mini App{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <div class="balance-pill">
                <span class="ton-logo">▼</span>
                <span class="balance-value" id="balance">0</span>
                <span class="balance-currency">TON</span>
            </div>

            <button class="connect-btn" id="connectBtn" type="button">
                <span class="wallet-icon">▣</span>
                Подключить
            </button>
        </header>

        <main class="page">
            {% block content %}{% endblock %}
        </main>

        <nav class="bottom-nav">
            <a href="/" class="nav-item {% if request.path == '/' %}active{% endif %}">
                <span class="nav-icon">✚</span>
                <span>Апгрейд</span>
            </a>
            <a href="/profile" class="nav-item {% if request.path == '/profile' %}active{% endif %}">
                <span class="nav-icon">♟</span>
                <span>Профиль</span>
            </a>
        </nav>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
